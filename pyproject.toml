[tool.poetry]
name = "webnlg-toolkit"
version = "0.1.0"
description = "A toolkit library for WebNLG-related tasks."
authors = ["Yifei Song"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
numpy = "1.26.4"
pandas = "^2.2.2"
transformers = "^4.44.0"
pytorch-lightning = "1.9.5"
torch = "^2.4.0"
bert-score = "0.3.13"
nltk = "3.8.1"
pyter3 = "0.3"
razdel = "0.5.0"
sacrebleu = "2.2.0"
tabulate = "0.8.9"
scikit-learn = "^1.5.1"
matplotlib = "^3.9.1.post1"
safetensors = "^0.4.4"
sentencepiece = "0.2.0"
protobuf = "3.20.3"
tensorflow = "^2.17.0"
sentence-transformers = "^3.0.1"
tf-keras = "^2.17.0"
wandb = "^0.17.7"
datasets = "^2.21.0"
spacy = "^3.7.5"
unidecode = "^1.3.8"
evaluate = "^0.4.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
